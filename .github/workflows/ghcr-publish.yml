name: Build and Publish to GHCR

on:
  push:
    branches: [agentic]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Build and push Docker image with Claude Code
        if: github.ref == 'refs/heads/agentic'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.agentic-with-cc
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            BASE_IMAGE=${{ steps.image.outputs.name }}:agentic
          tags: ${{ steps.image.outputs.name }}:agentic-with-cc
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cc
          cache-to: type=gha,mode=max,scope=cc

      - name: Build and push Docker image with GitHub Copilot CLI
        if: github.ref == 'refs/heads/agentic'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.agentic-with-copilot
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            BASE_IMAGE=${{ steps.image.outputs.name }}:agentic
          tags: ${{ steps.image.outputs.name }}:agentic-with-copilot
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=copilot
          cache-to: type=gha,mode=max,scope=copilot

      - name: Build and push Docker image with OpenAI Codex CLI
        if: github.ref == 'refs/heads/agentic'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.agentic-with-codex
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            BASE_IMAGE=${{ steps.image.outputs.name }}:agentic
          tags: ${{ steps.image.outputs.name }}:agentic-with-codex
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=codex
          cache-to: type=gha,mode=max,scope=codex
