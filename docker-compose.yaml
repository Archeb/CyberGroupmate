services:
  cybergroupmate:
    build: .
    container_name: cybergroupmate
    environment:
      - LOG_LEVEL=info
    ports:
      - "6767:6767"
    volumes:
      - ./config.yaml:/app/config.yaml
      - cybergroupmate-data:/app/workspace
      - cybergroupmate-agent-env:/app/agent-data
    restart: unless-stopped
    # Telegram userbot 首次登录需要交互式输入 OTP/2FA
    # 使用 docker attach cybergroupmate 连接后输入
    stdin_open: true
    tty: true

volumes:
  cybergroupmate-data:
  cybergroupmate-agent-env:
